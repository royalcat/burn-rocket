name: build images

# One commit -> two container images of rocket-inference:
#   aarch64 (primary) — the full build with RK3588 NPU offload (`serve` uses the
#                       NPU by default on this build; `--no-npu` forces flex).
#   amd64             — x86-64-v3 flex CPU build (no NPU support).
# Each builds with Buildx on a native runner of the matching architecture (no
# cross-compilation, no emulation) and pushes to GHCR; the aarch64 image takes
# the primary tags (<sha>, latest, <v-tag>), the amd64 image the -amd64 suffixed
# ones (docker/metadata-action). Both jobs keep a per-architecture GitHub
# Actions build cache. Pull requests build without pushing, and the registry
# login is skipped there (fork PRs get a read-only token).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rocket-inference

jobs:
  amd64:
    name: amd64 image (x86-64-v3, no NPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-amd64
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: examples/rocket-inference/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  arm64:
    name: arm64 image (NPU)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install the librocketnpu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libdrm-dev file
      # Ubuntu 24.04's kernel uapi headers predate the mainline rocket accel
      # driver, and rocket-userspace needs drm/rocket_accel.h (Linux v6.18).
      - name: Install the mainline rocket uAPI header
        run: |
          sudo mkdir -p /usr/include/drm
          curl -fsSL \
            https://raw.githubusercontent.com/torvalds/linux/v6.18/include/uapi/drm/rocket_accel.h \
            | sudo tee /usr/include/drm/rocket_accel.h >/dev/null
      - name: Build librocketnpu.a
        run: scripts/build-rocketnpu.sh --target host

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: examples/rocket-inference/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
