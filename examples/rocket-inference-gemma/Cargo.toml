[package]
name = "rocket-inference-gemma"
version = "0.1.0"
edition = "2024"

[features]
default = ["cpu"]
# CubeCL/LLVM CPU backend. Disabled for cross-builds: cubecl-llvm links a prebuilt
# host-architecture LLVM bundle (fails to link for aarch64). The `flex` backend is
# always available.
cpu = ["burn/cpu", "burn/autotune", "burn/fusion"]
# RK3588 NPU offload via librocketnpu (aarch64 only; see the root burn-rocket crate).
npu = ["dep:burn-rocket", "burn-rocket/npu"]

[target.'cfg(target_arch = "aarch64")'.dependencies]
burn-rocket = { path = "../..", optional = true }

[dependencies]
burn = { version = "=0.22.0-pre.4", default-features = false, features = [
    "std",
    "flex",
    "rayon",
    "simd",
    "store",
] }
burn-store = { version = "=0.22.0-pre.4", default-features = false, features = [
    "std",
    "safetensors",
    "memmap",
] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
base64 = "0.22"
rustfft = "6"
hound = "3"
tokenizers = "0.21"
fancy-regex = "0.16"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "tiff",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
anyhow = "1"
mozjpeg = "0.10.13"
