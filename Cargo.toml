[package]
name = "burn-rocket"
version = "0.1.0"
edition = "2024"
description = "RK3588 NPU offload (mainline `rocket` driver) via librocketnpu"
license = "GPL-3.0-or-later"

[workspace]
members = ["examples/qwen3-embeddings"]

[features]
default = []
# Burn's `#[backend_extension(Flex)]` catalog cfg is evaluated in this crate, so
# the feature selecting the `Flex` backend must be named exactly `flex`.
flex = ["dep:burn", "dep:rayon"]
# The NPU extension ops (`crate::ext`); links librocketnpu (see build.rs).
npu = ["flex"]

[dependencies]
libc = "0.2"
half = "2"
rayon = { version = "1", optional = true }
burn = { version = "=0.22.0-pre.4", default-features = false, features = [
    "std",
    "flex",
    "extension",
], optional = true }

# Low-level FFI probe (`RocketCtx`/`RocketWeight`); links librocketnpu, so it
# needs the `npu` feature (aarch64).
[[example]]
name = "probe"
required-features = ["npu"]

[profile.release]
opt-level = 3
debug = false
